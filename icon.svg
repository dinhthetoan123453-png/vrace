<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc4c02" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#orangeGrad)" />
  
  <!-- Activity route path line -->
  <path d="M 96 360 Q 180 400 240 320 T 360 220 T 420 150" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="20" stroke-linecap="round" stroke-dasharray="10 20" />
  
  <!-- Activity Pulse / Runner Glyph -->
  <g transform="translate(40, 30)" stroke="url(#whiteGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Activity Pulse Polyline -->
    <path d="M 60 226 L 140 226 L 180 146 L 230 306 L 280 186 L 310 226 L 372 226" />
    <!-- Pin waypoint -->
    <circle cx="372" cy="226" r="14" fill="#ffffff" />
  </g>
</svg>
